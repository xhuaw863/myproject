server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: yb-interface
  # 文件上传(头像/签名图片/企业资质PDF)大小限制
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB
  # 静态资源(前端 JS/CSS/HTML)不缓存, 每次加载都向服务器重新校验,
  # 避免浏览器启发式缓存导致前端改动(如新增菜单/视图)不生效
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yb_interface?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    # 数据库口令经环境变量注入(生产严禁使用默认值): DB_PASSWORD
    password: ${DB_PASSWORD:bsoft}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

mybatis-plus:
  type-aliases-package: com.yb.hi.entity
  configuration:
    map-underscore-to-camel-case: true
    # StdOutImpl 会把每行结果同步写 stdout(实测每列表请求多付 150~400ms, 日志文件小时级膨胀至 40MB+),
    # 排障需要时临时改回 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null

# 医保接口配置
yb:
  # 模拟医保平台模式: true-本地模拟响应(界面验证用), false-调用真实医保平台
  mock-enabled: true
  # 交易接口地址(地方医保局前置机)
  api-url: http://127.0.0.1:8000/hsa-mdtrt/api/medical/insurance
  # 字典文件下载地址
  file-download-url: http://127.0.0.1:8000/hsa-mdtrt/api/medical/download
  # 定点医药机构编号(表3: 14位)
  fixmedins-code: H4201000000000
  # 定点医药机构名称
  fixmedins-name: 测试医院
  # 就医地区行政区划
  mdtrtarea-admvs: "420100"
  # 接收方系统编码
  recer-sys-code: HIS
  # 接口版本号
  infver: "V1.0"
  # 经办人类别(表3, 代码域: 1-经办人 2-自助终端 3-移动终端)
  opter-type: "1"
  # 经办人编号
  opter: admin
  # 经办人姓名
  opter-name: 管理员
  # 对账(3201/3202): 结算经办机构/清算类别/退费结算标志(取值与平台确认后配置; 3201标志6位, 3202标志3位)
  # setl-optins: ""
  # clr-type: ""
  # refd-setl-flag-3201: "000000"
  # refd-setl-flag-3202: "000"
  # 对账调度 cron(默认每日 07:00 对 T-1 结算日)
  recon-cron: "0 0 7 * * *"
  # 目录对照上传(3301/3302)list_type 目录类别(规范第6章值域, 与平台确认后按目录类型配置; 未配置时对应目录类型拒绝上传)
  list-type-drug: ${YB_LIST_TYPE_DRUG:}
  list-type-cons: ${YB_LIST_TYPE_CONS:}
  list-type-charge: ${YB_LIST_TYPE_CHARGE:}
  # 签名证书编号
  sign-no: ""
  # SM2 私钥(Base64), 配置后启用真实SM2签名
  sm2-private-key: ""
  # SM2 公钥(Base64)
  sm2-public-key: ""
  # 加密类型
  enc-type: ""
  # 字典文件本地保存路径
  dict-file-path: ./data/dict/
  # 连接超时(毫秒)
  connect-timeout: 30000
  # 读取超时(毫秒)
  read-timeout: 60000

logging:
  level:
    com.yb.hi: debug
    org.springframework: info

# HIS 应用配置
his:
  jwt:
    # 令牌签名密钥: 环境变量 HIS_JWT_SECRET 注入(生产必须 ≥32字符独立强密钥; 使用默认密钥时启动报错级日志)
    secret: ${HIS_JWT_SECRET:yb-his-default-secret-key-2026}
    # 令牌有效期(分钟)
    expire-minutes: 720
  demo-data:
    # 启动时幂等初始化演示医院与管理员账号
    enabled: true
  upload:
    # 上传文件本地保存根目录(相对运行目录, 与 dict-file-path 一致风格)
    path: ./data/upload/
    # 静态访问URL前缀(WebMvcConfig 映射到 upload.path)
    url-prefix: /uploads/

# 标准字典(医保编码库/国家临床版/中医分类)导入配置
std-dict:
  # 标准字典源文件根目录(字典标准文件夹绝对路径)
  base-path: D:/study/ybtest/字典标准
  # 是否启用标准字典导入/查询接口
  enabled: true
  # 启动时自动全量导入(默认关闭, 通过接口按需触发)
  auto-import-on-startup: false
  # 批量提交大小
  batch-size: 1000
